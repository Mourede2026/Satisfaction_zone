<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ets MOUREDE & ASSOCIES</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mourede & Associés">
<style>
  :root{--brand:#0f4c81}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(ellipse at top, #eef4fa 0%, #f4f6f8 60%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; text-align:center; overflow-x:hidden;
  }

  .diamond{
    width:110px; height:auto; margin-bottom:8px;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink{
    0%, 100% { opacity:1; transform:scale(1); filter:drop-shadow(0 0 0 rgba(15,76,129,0)); }
    50%      { opacity:.5; transform:scale(1.07); filter:drop-shadow(0 0 14px rgba(15,76,129,.45)); }
  }

  .marquee-wrap{
    width:min(680px, 92vw); overflow:hidden; margin:6px 0 28px;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .marquee-track{
    display:flex; width:max-content;
    animation: marquee 16s linear infinite;
  }
  .marquee-track img{ height:56px; margin-right:70px; display:block; }
  @keyframes marquee{
    from{ transform:translateX(0); }
    to  { transform:translateX(-50%); }
  }

  .tagline{ color:#6b7280; font-size:.85rem; max-width:520px; margin:0 0 40px; line-height:1.5 }

  .buttons{ display:flex; flex-direction:column; gap:16px; width:100%; max-width:420px }
  .btn{
    display:block; padding:18px 20px; border-radius:14px; font-weight:700; font-size:1.02rem;
    text-decoration:none; border:none; cursor:pointer; transition:.15s; line-height:1.35;
  }
  .btn-primary{ background:var(--brand); color:#fff; box-shadow:0 6px 18px rgba(15,76,129,.28) }
  .btn-primary:hover{ background:#0c3c68; transform:translateY(-1px) }
  .btn-disabled{
    background:#e9edf1; color:#9aa5b1; cursor:not-allowed; position:relative;
  }
  .btn-disabled .soon{
    display:block; font-size:.72rem; font-weight:600; margin-top:4px; color:#b3bcc4;
  }

  footer{ margin-top:48px; font-size:.72rem; color:#b3bcc4 }
</style>
</head>
<body>

  <img class="diamond" src="logo-diamond.png" alt="Ets MOUREDE & ASSOCIES">

  <div class="marquee-wrap">
    <div class="marquee-track">
      <img src="logo-text.png" alt="Ets MOUREDE & ASSOCIES">
      <img src="logo-text.png" alt="Ets MOUREDE & ASSOCIES" aria-hidden="true">
    </div>
  </div>

  <p class="tagline">Étude – Consultation – Diverses prestations de service – Commerce Général –
    Fourniture – Informatique – Matériel et Fourniture de bureau</p>

  <div class="buttons">
    <a class="btn btn-primary" href="acces.html">Satisfaction des usagers des zones sanitaires</a>
    <button class="btn btn-disabled" disabled title="Bientôt disponible">
      Satisfaction des usagers des hôpitaux
      <span class="soon">Bientôt disponible</span>
    </button>
  </div>

  <footer>© Ets MOUREDE &amp; ASSOCIES<br>RCCM : RB/ODH/10-A-028   IFU : 3 2010 0030 3210   Tél : 00229 01 97 51 81 22 – 01 97 34 73 26</footer>

</body>
</html>
