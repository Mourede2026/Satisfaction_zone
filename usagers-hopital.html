<style>
  :root{--brand:#0f4c81}

  header{background:var(--brand);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
  header h1{font-size:1.05rem;margin:0;font-weight:700}
  .badge{background:#e08e0b;color:#fff;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700}
  .status-banner{font-size:.8rem;text-align:center;padding:0;max-height:0;overflow:hidden;transition:.2s}
  .status-banner.offline{background:#c0392b;color:#fff;padding:8px;max-height:40px}
  .status-banner.queued{background:#e08e0b;color:#fff;padding:8px;max-height:40px}
  .progressWrap{background:#e2e8f0;height:5px}
  .progressBar{background:var(--brand);height:100%;width:0;transition:.25s}
  .progressText{text-align:center;font-size:.75rem;color:#6b7280;padding:8px 0 0}
  main{max-width:640px;margin:0 auto;padding:18px}
  .secTitle{font-size:1.05rem;color:var(--brand);margin:6px 0 18px;line-height:1.4}
  .field{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .field label{display:block;font-weight:600;margin-bottom:8px;line-height:1.4}
  .req{color:#c0392b}
  .hint{font-size:.78rem;color:#9aa5b1;margin:-4px 0 10px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:flex-start;gap:8px;font-weight:400;background:#f8fafc;border-radius:10px;padding:10px 12px;cursor:pointer}
  .opt input{margin-top:3px}
  textarea, input[type=number]{width:100%;padding:10px;border:1px solid #dfe4ea;border-radius:10px;font-size:.95rem;font-family:inherit}
  .note{background:#eef4fa;border-left:4px solid var(--brand);border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:.92rem;line-height:1.5}
  .gpsBox{background:#f8fafc;border-radius:10px;padding:12px;font-size:.85rem}
  .gpsBox.gpsOk{background:#e8f7ef;color:#1a9e5c}
  .gpsBox.gpsErr{background:#fdecea;color:#c0392b}
  .gpsBox button{margin-top:8px;margin-right:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;font-size:.8rem}
  .navBar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 18px;display:flex;gap:10px;justify-content:space-between;z-index:5}
  .navBar button{flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:.95rem;cursor:pointer}
  #btnPrev{background:#eef1f4;color:#1f2937}
  #btnNext{background:var(--brand);color:#fff}
  #btnSubmit{background:#1a9e5c;color:#fff}
  .toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 18px;border-radius:10px;font-size:.85rem;max-width:90vw;text-align:center;z-index:10}
</style>
